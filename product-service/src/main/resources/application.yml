server:
    port: 8084
    forward-headers-strategy: native
    tomcat:
        relaxed-query-chars: '[,]'


spring:
    application:
        name: rarego
    config:
        import: optional:file:.env[.properties]
    profiles:
        active: ${SPRING_PROFILES_ACTIVE:dev}
    output:
        ansi:
            enabled: always
    batch:
        job:
            enabled: false
    data:
        redis:
            host: ${SPRING_DATA_REDIS_HOST:localhost}
            port: ${SPRING_DATA_REDIS_PORT:6379}
            password: ${SPRING_DATA_REDIS_PASSWORD:}
        elasticsearch:
            uris: http://localhost:9200
    ai:
        openai:
            api-key: ${OPENAI_API_KEY:empty}
            embedding:
                options:
                    model: text-embedding-3-small
        api:
            timeout: 30s

    kafka:
        bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
        consumer:
            group-id: ${spring.application.name}-group

aws:
    s3:
        bucket: rarego-auction-product-images
        expiration-minutes: 5
    credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
    region: ap-northeast-2

jwt:
    secret: ${JWT_SECRET}
    access-token-expire-seconds: ${JWT_ACCESS_TOKEN_EXPIRE_SECONDS:3600}
    refresh-token-expire-seconds: ${JWT_REFRESH_TOKEN_EXPIRE_SECONDS:86400}

custom:
    global:
        internalBackUrl: ${INTERNAL_BACK_URL:http://rarego-nginx}
        frontUrl: ${FRONT_URL:http://localhost:3000}
    payment:
        settlement:
            chunkSize: 10
            holdDays: 7
        systemMemberId: 1


springdoc:
    api-docs:
        path: /api-docs
    swagger-ui:
        path: /swagger-ui.html
        tags-sorter: alpha
        operations-sorter: alpha

rarego:
    s3:
        enabled: true

auction:
    payment-timeout-days: 3
