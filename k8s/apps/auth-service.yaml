apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: rarego
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: rarego-auth-service:latest
        ports:
        - containerPort: 8089
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: JAVA_OPTS
          value: "-Xms128m -Xmx256m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://mysql:3306/rarego_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: secret
        - name: SPRING_DATA_REDIS_HOST
          value: "redis"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: oauth-secret
              key: google-id
        - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: oauth-secret
              key: google-secret
        - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: oauth-secret
              key: kakao-id
        - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_NAVER_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: oauth-secret
              key: naver-id
        - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_NAVER_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: oauth-secret
              key: naver-secret
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: global-config
              key: SPRING_PROFILES_ACTIVE
        - name: FRONT_URL
          valueFrom:
            configMapKeyRef:
              name: global-config
              key: FRONT_URL
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: rarego
spec:
  selector:
    app: auth-service
  ports:
  - protocol: TCP
    port: 8089
    targetPort: 8089
