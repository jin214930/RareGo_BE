apiVersion: apps/v1
kind: Deployment
metadata:
  name: auction-service
  namespace: rarego
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auction-service
  template:
    metadata:
      labels:
        app: auction-service
    spec:
      containers:
      - name: auction-service
        image: rarego-auction-service:latest
        ports:
        - containerPort: 8083
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: JAVA_OPTS
          value: "-Xms128m -Xmx256m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://mysql:3306/rarego_auction?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: secret
        - name: SPRING_DATA_REDIS_HOST
          value: "redis"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: SPRING_ELASTICSEARCH_URIS
          value: "http://elasticsearch:9200"
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: global-config
              key: SPRING_PROFILES_ACTIVE
        - name: FRONT_URL
          valueFrom:
            configMapKeyRef:
              name: global-config
              key: FRONT_URL
---
apiVersion: v1
kind: Service
metadata:
  name: auction-service
  namespace: rarego
spec:
  selector:
    app: auction-service
  ports:
  - protocol: TCP
    port: 8083
    targetPort: 8083
