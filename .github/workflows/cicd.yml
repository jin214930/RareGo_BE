name: CI/CD

on:
  pull_request:
    branches: [ "dev", "main" ]
  push:
    branches: [ "dev", "main" ]

permissions:
  contents: read
  packages: write

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Test + Coverage verify (JaCoCo)
        run: ./gradlew test jacocoTestCoverageVerification

      - name: Build with Gradle
        run: ./gradlew build -x test

  build-images:
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - name: app
            dockerfile: Dockerfile
            image_suffix: ""
          - name: payment-service
            dockerfile: payment-service/Dockerfile
            image_suffix: "-payment-service"
          - name: product-service
          - dockerfile: product-service/Dockerfile
          - image_suffix: "-product-service"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}${{ matrix.image_suffix }}
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build-test, build-images]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect infra changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            infra:
              - 'docker-compose.yml'
              - 'docker/**'

      - name: Copy docker-compose.yml to EC2
        if: steps.changes.outputs.infra == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "docker-compose.yml,docker"
          target: "~/app"

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_INFRA: ${{ steps.changes.outputs.infra }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            mkdir -p ~/app
            cd ~/app
            
            # .env.deploy 파일 초기화 및 환경 변수 주입
            echo "DOCKER_IMAGE=${{ env.REGISTRY }}/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]'):${{ github.ref_name }}" > .env.deploy
            echo "PAYMENT_DOCKER_IMAGE=${{ env.REGISTRY }}/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')-payment-service:${{ github.ref_name }}" >> .env.deploy
            echo "PRODUCT_DOCKER_IMAGE=${{ env.REGISTRY }}/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')-product-service:${{ github.ref_name }}" >> .env.deploy
            echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env.deploy
            echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> .env.deploy
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env.deploy
            echo "DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}" >> .env.deploy
            echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env.deploy
            echo "TZ=${{ secrets.TZ }}" >> .env.deploy
            echo "TOSS_PAYMENTS_SECRET_KEY=${{ secrets.TOSS_PAYMENTS_SECRET_KEY }}" >> .env.deploy
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env.deploy
            echo "AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }}" >> .env.deploy
            echo "AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }}" >> .env.deploy
            echo "INTERNAL_BACK_URL=${{ secrets.INTERNAL_BACK_URL }}" >> .env.deploy
            echo "FRONT_URL=${{ secrets.FRONT_URL }}" >> .env.deploy
            echo "GRAFANA_ADMIN_USER=${{ secrets.GRAFANA_ADMIN_USER }}" >> .env.deploy
            echo "GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}" >> .env.deploy
            echo "GF_SERVER_ROOT_URL=${{ secrets.GF_SERVER_ROOT_URL }}" >> .env.deploy
            echo "GF_SERVER_SERVE_FROM_SUB_PATH=${{ secrets.GF_SERVER_SERVE_FROM_SUB_PATH }}" >> .env.deploy
            echo "REDIS_HOST=${{ secrets.REDIS_HOST }}" >> .env.deploy
            echo "REDIS_PORT=${{ secrets.REDIS_PORT }}" >> .env.deploy
            echo "KAFKA_BOOTSTRAP_SERVERS=${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}" >> .env.deploy
            echo "ELASTICSEARCH_URIS=${{ secrets.ELASTICSEARCH_URIS }}" >> .env.deploy
            
            # GitHub Secret에서 프로필 설정
            echo "SPRING_PROFILES_ACTIVE=${{ secrets.SPRING_PROFILES_ACTIVE }}" >> .env.deploy
            
            # 소셜 로그인 키 추가
            echo "GOOGLE_CLIENT=${{ secrets.GOOGLE_CLIENT }}" >> .env.deploy
            echo "GOOGLE_SECRET=${{ secrets.GOOGLE_SECRET }}" >> .env.deploy
            echo "KAKAO_CLIENT=${{ secrets.KAKAO_CLIENT }}" >> .env.deploy
            echo "NAVER_CLIENT=${{ secrets.NAVER_CLIENT }}" >> .env.deploy
            echo "NAVER_SECRET=${{ secrets.NAVER_SECRET }}" >> .env.deploy

            docker login ${{ env.REGISTRY }} -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            
            # if/else 문을 제거하고 항상 모든 서비스를 pull 하고 up 시킵니다.
            docker compose --env-file .env.deploy pull
            docker compose --env-file .env.deploy up -d
            
            docker image prune -f
