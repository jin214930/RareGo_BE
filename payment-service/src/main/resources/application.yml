server:
  port: 8082
  forward-headers-strategy: native
  tomcat:
    relaxed-query-chars: '[,]'

spring:
  application:
    name: payment-service
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  output:
    ansi:
      enabled: always
  batch:
    job:
      enabled: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

toss:
  payments:
    secretKey: ${TOSS_PAYMENTS_SECRET_KEY}
    url: "https://api.tosspayments.com/v1/payments"

jwt:
  secret: ${JWT_SECRET}
  access-token-expire-seconds: ${JWT_ACCESS_TOKEN_EXPIRE_SECONDS:3600}
  refresh-token-expire-seconds: ${JWT_ACCESS_TOKEN_EXPIRE_SECONDS:86400}

custom:
  global:
    internalBackUrl: ${INTERNAL_BACK_URL:http://rarego-nginx}
    frontUrl: ${FRONT_URL:http://localhost:3000}
  payment:
    settlement:
      chunkSize: 10
      holdDays: 7
    systemMemberId: 1

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

auction:
  payment-timeout-days: 3
payment:
  outbox:
    retry-delay-ms: 300000
