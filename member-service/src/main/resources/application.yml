server:
  port: 8081
  forward-headers-strategy: native
  tomcat:
    relaxed-query-chars: '[,]'

spring:
  application:
    name: member-service
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  output:
    ansi:
      enabled: always
  batch:
    job:
      enabled: false

jwt:
  secret: ${JWT_SECRET}
  access-token-expire-seconds: ${JWT_ACCESS_TOKEN_EXPIRE_SECONDS:3600}
  refresh-token-expire-seconds: ${JWT_ACCESS_TOKEN_EXPIRE_SECONDS:86400}

custom:
  global:
    internalBackUrl: ${INTERNAL_BACK_URL:http://rarego-nginx}
  payment:
    settlement:
      chunkSize: 10
      holdDays: 7
    systemMemberId: 1

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

auction:
  payment-timeout-days: 3

