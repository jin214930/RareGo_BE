server:
  port: 8081
  forward-headers-strategy: native
  tomcat:
    relaxed-query-chars: '[,]'

spring:
  application:
    name: member-service
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  output:
    ansi:
      enabled: always
  batch:
    job:
      enabled: false

jwt:
  secret: ${JWT_SECRET}
  access-token-expire-seconds: ${JWT_ACCESS_TOKEN_EXPIRE_SECONDS:3600}
  refresh-token-expire-seconds: ${JWT_ACCESS_TOKEN_EXPIRE_SECONDS:86400}

custom:
  services:
    auth-url: http://localhost:8080
    member-url: http://localhost:8081
    payment-url: http://localhost:8082
    auction-url: http://localhost:8083
    product-url: http://localhost:8084
    notification-url: http://localhost:8085

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

auction:
  payment-timeout-days: 3
