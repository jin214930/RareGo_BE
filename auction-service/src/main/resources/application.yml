server:
    port: 8083
    forward-headers-strategy: native
    tomcat:
        relaxed-query-chars: '[,]'


spring:
    application:
        name: auction-service
    config:
        import: optional:file:.env[.properties]
    profiles:
        active: ${SPRING_PROFILES_ACTIVE:dev}
    output:
        ansi:
            enabled: always
    batch:
        job:
            enabled: false
    data:
        redis:
            host: ${SPRING_DATA_REDIS_HOST:localhost}
            port: ${SPRING_DATA_REDIS_PORT:6379}
        elasticsearch:
            uris: http://localhost:9200

    kafka:
        bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

app:
    topic:
        auction-ended: auction.ended.v1
        auction-relisted: auction.relisted.v1
        auction-started: auction.started.v1

jwt:
    secret: ${JWT_SECRET}
    access-token-expire-seconds: ${JWT_ACCESS_TOKEN_EXPIRE_SECONDS:3600}
    refresh-token-expire-seconds: ${JWT_REFRESH_TOKEN_EXPIRE_SECONDS:86400}

custom:
    global:
        internalBackUrl: ${INTERNAL_BACK_URL:http://rarego-nginx}
        frontUrl: ${FRONT_URL:http://localhost:3000}
    payment:
        settlement:
            chunkSize: 10
            holdDays: 7
        systemMemberId: 1
    services:
        auth-url: http://rarego-nginx
        member-url: http://rarego-nginx
        payment-url: http://rarego-nginx
        auction-url: http://rarego-nginx
        product-url: http://rarego-nginx
        notification-url: http://rarego-nginx

springdoc:
    api-docs:
        path: /api-docs
    swagger-ui:
        path: /swagger-ui.html
        tags-sorter: alpha
        operations-sorter: alpha

auction:
    payment-timeout-days: 3
